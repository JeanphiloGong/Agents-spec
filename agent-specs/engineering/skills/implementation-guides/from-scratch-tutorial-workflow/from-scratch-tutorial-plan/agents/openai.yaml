interface:
  display_name: "From-Scratch Tutorial Plan"
  short_description: "v0.1.2 - Plan a defect-driven tutorial with patch/checkpoint boundaries"
  default_prompt: "Use $from-scratch-tutorial-plan to plan one from-scratch implementation tutorial before drafting it. Define the reader goal, external contract, teaching example, connected code-version checkpoints, concrete previous-version defects, Code Change Type and Code Change Target for each step, final assembled checkpoint, helper contracts, review risks, and build handoff."
