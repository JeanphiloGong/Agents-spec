interface:
  display_name: "From-Scratch Tutorial Plan"
  short_description: "v0.3.2 - Plan versioned from-scratch tutorial documents"
  default_prompt: "Use $from-scratch-tutorial-plan to plan a coherent from-scratch tutorial series. Use a navigation-only entry and separate V0 through Vn capability documents, with V1.C0-style checkpoints inside each version. Define version scope, exact entry baselines, required files and commands, task acceptance criteria, dependencies, document targets, and each version's assembled final checkpoint. Preserve Nystrom/Karpathy/Norvig teaching standards, caller-visible first inputs, and the increment cycle. Plan empty-directory replay through all checkpoints and version freezes. Include build handoff and checkpoint commit handoff only when requested. Do not add a document-mode selector or combine version bodies."
