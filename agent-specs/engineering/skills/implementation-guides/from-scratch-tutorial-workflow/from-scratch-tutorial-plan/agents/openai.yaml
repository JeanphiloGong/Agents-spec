interface:
  display_name: "From-Scratch Tutorial Plan"
  short_description: "v0.3.1 - Plan task-first from-scratch tutorials"
  default_prompt: "Use $from-scratch-tutorial-plan to plan one from-scratch implementation tutorial before drafting it. Apply the Nystrom/Karpathy/Norvig standard, then output a task-first tutorial plan: reader goal, real scenario, problem compression, core model, invariants, external contract, teaching example, tutorial dependency graph, tutorial build task list with acceptance criteria, verification, dependencies, document targets, checkpoint commit handoff table, helper contracts, review risks, and build handoff. The first naive baseline must start from caller-visible input or behavior, not a future internal carrier or final abstraction. Do not output an old row-based step table as the main plan."
