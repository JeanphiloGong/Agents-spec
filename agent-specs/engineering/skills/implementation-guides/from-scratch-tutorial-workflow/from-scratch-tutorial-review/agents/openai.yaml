interface:
  display_name: "From-Scratch Tutorial Review"
  short_description: "v0.2.0 - Review Nystrom/Karpathy/Norvig tutorials"
  default_prompt: "Use $from-scratch-tutorial-review to review a from-scratch implementation tutorial against the Nystrom/Karpathy/Norvig standard and the tutorial increment cycle. Check for missing real scenario, weak problem compression, missing core model or invariants, checklist-like public prose, skipped reasoning, missing pressure, vague breaks, disconnected code versions, unclear patch/checkpoint roles, incomplete final assembled checkpoint, public Step Self-Review leakage, unexplained helpers, missing step checks or freeze points, silent semantic choices, and final-code drift. Lead with findings and end with a pass, revise, or block verdict."
