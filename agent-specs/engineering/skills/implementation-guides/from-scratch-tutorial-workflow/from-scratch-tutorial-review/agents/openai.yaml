interface:
  display_name: "From-Scratch Tutorial Review"
  short_description: "v0.1.4 - Review pressure-driven tutorial quality and final checkpoints"
  default_prompt: "Use $from-scratch-tutorial-review to review a from-scratch implementation tutorial for skipped reasoning, missing pressure examples, vague step rationale, executable continuity bugs, unclear patch/checkpoint code-change roles, incomplete final assembled checkpoint, public Step Self-Review leakage, unexplained helpers, missing Step Check or Freeze This Version fields, silent semantic choices, and final-code drift. Lead with findings and end with a pass, revise, or block verdict."
