interface:
  display_name: "From-Scratch Tutorial Review"
  short_description: "v0.1.1 - Review defect-driven from-scratch tutorial quality"
  default_prompt: "Use $from-scratch-tutorial-review to review a from-scratch implementation tutorial for skipped reasoning, vague step rationale, disconnected code versions, unexplained helpers, missing Step Check or Freeze This Version fields, missing step self-review, and final-code drift. Lead with findings and end with a pass, revise, or block verdict."
