interface:
  display_name: "From-Scratch Tutorial Review"
  short_description: "v0.3.2 - Review versioned from-scratch tutorial documents"
  default_prompt: "Use $from-scratch-tutorial-review to review a tutorial series or plan. Name the reviewed versions. Check a navigation-only entry, separate V0 through Vn capability documents, V1.C0-style checkpoint sections, task targets, verified entry baselines, required files and commands, each version's assembled final checkpoint, and replay through version transitions. Check Nystrom/Karpathy/Norvig standards, concrete pressure, explained helpers, current-step evidence, semantic choices, and code drift. Treat combined version bodies as revise and hidden future-code dependencies or failing transitions as block. Distinguish planned checks from executed evidence. Lead with findings and give a pass, revise, or block verdict."
