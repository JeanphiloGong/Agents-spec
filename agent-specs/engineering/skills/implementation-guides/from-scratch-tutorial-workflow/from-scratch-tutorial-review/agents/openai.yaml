interface:
  display_name: "From-Scratch Tutorial Review"
  short_description: "v0.3.0 - Review task-first from-scratch tutorials"
  default_prompt: "Use $from-scratch-tutorial-review to review a from-scratch implementation tutorial or plan against task-first planning, the Nystrom/Karpathy/Norvig standard, and the tutorial increment cycle. Check for missing real scenario, weak problem compression, missing core model or invariants, old row-based step tables used as the main handoff, missing task acceptance criteria, missing dependencies, missing verification, missing checkpoint commit handoff when requested, checklist-like public prose, skipped reasoning, missing pressure, vague breaks, disconnected task/checkpoint continuity, unclear patch/checkpoint roles, incomplete final assembled checkpoint, public Step Self-Review leakage, unexplained helpers, missing step checks or freeze points, silent semantic choices, and final-code drift. Lead with findings and end with a pass, revise, or block verdict."
