interface:
  display_name: "From-Scratch Tutorial Review"
  short_description: "v0.1.3 - Review defect-driven tutorial quality and final checkpoints"
  default_prompt: "Use $from-scratch-tutorial-review to review a from-scratch implementation tutorial for skipped reasoning, vague step rationale, executable continuity bugs, unclear patch/checkpoint code-change roles, incomplete final assembled checkpoint, unexplained helpers, missing Step Check or Freeze This Version fields, missing step self-review, silent semantic choices, and final-code drift. Lead with findings and end with a pass, revise, or block verdict."
