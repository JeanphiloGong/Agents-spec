interface:
  display_name: "From-Scratch Tutorial Review"
  short_description: "v0.3.3 - Review versioned tutorials, checkpoints, and data flow"
  default_prompt: "Use $from-scratch-tutorial-review to review a tutorial series or plan. Name the reviewed versions. Check navigation, separate V0 through Vn documents, checkpoint sections, task targets, verified baselines, assembled final checkpoints, replay through transitions, and applicable data-flow/model ownership. Check Nystrom/Karpathy/Norvig standards, concrete pressure, explained helpers, current-step evidence, semantic choices, and code drift. Treat combined version bodies as revise and hidden dependencies or failing transitions as block. Distinguish planned checks from executed evidence. Lead with findings and give a pass, revise, or block verdict."
