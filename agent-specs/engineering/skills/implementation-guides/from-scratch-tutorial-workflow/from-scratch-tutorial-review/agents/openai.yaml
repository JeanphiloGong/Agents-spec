interface:
  display_name: "From-Scratch Tutorial Review"
  short_description: "v0.1.5 - Review tutorials against the increment cycle"
  default_prompt: "Use $from-scratch-tutorial-review to review a from-scratch implementation tutorial against the tutorial increment cycle: Pressure -> Naive version -> Break -> Change -> Check -> Freeze. Check for skipped reasoning, missing pressure, vague breaks, disconnected code versions, unclear patch/checkpoint roles, incomplete final assembled checkpoint, public Step Self-Review leakage, unexplained helpers, missing step checks or freeze points, silent semantic choices, and final-code drift. Lead with findings and end with a pass, revise, or block verdict."
