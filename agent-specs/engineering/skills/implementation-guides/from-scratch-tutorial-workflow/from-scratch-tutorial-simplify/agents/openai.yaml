interface:
  display_name: "From-Scratch Tutorial Simplify"
  short_description: "v0.3.1 - Simplify task-first from-scratch tutorials"
  default_prompt: "Use $from-scratch-tutorial-simplify to tighten a completed from-scratch implementation tutorial while preserving task/checkpoint continuity, the Nystrom/Karpathy/Norvig standard, and the tutorial increment cycle: Pressure -> Naive baseline -> Break -> Change -> Check -> Freeze. Preserve real scenario, problem compression, core model, invariants, patch/checkpoint targets, connected code checkpoints, the final assembled checkpoint, helper boundaries, source facts, first-baseline caller-visible input before internal abstractions, and final-code traceability. Convert checklist-like public scaffolding and Step Self-Review sections into natural reader-facing tutorial prose."
