interface:
  display_name: "From-Scratch Tutorial Simplify"
  short_description: "v0.3.2 - Simplify versioned tutorial prose and navigation"
  default_prompt: "Use $from-scratch-tutorial-simplify to tighten a completed tutorial series while preserving its navigation-only entry, separate V0 through Vn capability documents, V1.C0-style checkpoint IDs, entry baselines, required files and commands, every version's assembled final checkpoint, and replay evidence. Link repeated shared context without removing local pressure or starting state. Preserve Nystrom/Karpathy/Norvig standards, the increment cycle, helper boundaries, source facts, and code behavior. Check links and replay affected executable instructions if changed. Do not merge version bodies or treat structural rebuilding as prose cleanup."
