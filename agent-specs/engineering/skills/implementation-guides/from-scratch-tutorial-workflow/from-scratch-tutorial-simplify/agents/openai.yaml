interface:
  display_name: "From-Scratch Tutorial Simplify"
  short_description: "v0.2.0 - Simplify without breaking tutorial standards"
  default_prompt: "Use $from-scratch-tutorial-simplify to tighten a completed from-scratch implementation tutorial while preserving the Nystrom/Karpathy/Norvig standard and the tutorial increment cycle: Pressure -> Naive version -> Break -> Change -> Check -> Freeze. Preserve real scenario, problem compression, core model, invariants, patch/checkpoint targets, connected code versions, the final assembled checkpoint, helper boundaries, source facts, and final-code traceability. Convert checklist-like public scaffolding and Step Self-Review sections into natural reader-facing tutorial prose."
