interface:
  display_name: "From-Scratch Tutorial Build"
  short_description: "v0.1.3 - Build a defect-driven tutorial with patch/checkpoint code changes"
  default_prompt: "Use $from-scratch-tutorial-build to produce a complete markdown from-scratch implementation tutorial. Derive behavior and invariants into connected code versions one complete step at a time; every step must name what breaks in the previous version, declare Code Change Type as patch or checkpoint, declare Code Change Target, explain why the change works, pass a Step Check, Freeze This Version, name Still Lacks, and self-review before the next step. The final meaningful code step must be an assembled complete checkpoint."
