interface:
  display_name: "From-Scratch Tutorial Build"
  short_description: "v0.1.5 - Build tutorials through the increment cycle"
  default_prompt: "Use $from-scratch-tutorial-build to produce a complete markdown from-scratch implementation tutorial through the tutorial increment cycle: Pressure -> Naive version -> Break -> Change -> Check -> Freeze -> Next step. Each step must show one pressure example, name what breaks, make one patch or checkpoint change with an explicit target, prove it with a Step Check, and freeze the version before continuing. Run self-review internally, do not output Step Self-Review, and make the final meaningful code step an assembled complete checkpoint."
