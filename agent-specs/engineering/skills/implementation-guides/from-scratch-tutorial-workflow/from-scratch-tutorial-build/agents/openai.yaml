interface:
  display_name: "From-Scratch Tutorial Build"
  short_description: "v0.1.4 - Build a pressure-driven tutorial with patch/checkpoint code changes"
  default_prompt: "Use $from-scratch-tutorial-build to produce a complete markdown from-scratch implementation tutorial. Derive behavior and invariants into connected code versions one complete step at a time; every step must show a pressure example before the fix, name what breaks in the previous version, declare Code Change Type as patch or checkpoint, declare Code Change Target, explain why the change works, pass a Step Check, Freeze This Version, and name Still Lacks. Run self-review internally before the next step, but do not output Step Self-Review. The final meaningful code step must be an assembled complete checkpoint."
