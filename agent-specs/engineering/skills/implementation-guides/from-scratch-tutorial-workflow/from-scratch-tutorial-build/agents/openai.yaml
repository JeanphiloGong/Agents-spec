interface:
  display_name: "From-Scratch Tutorial Build"
  short_description: "v0.3.2 - Build versioned from-scratch tutorial documents"
  default_prompt: "Use $from-scratch-tutorial-build to build the plan as a navigation-only entry and separate V0 through Vn capability documents. Draft one V1.C0-style checkpoint at a time with pressure, previous baseline, break, one patch or checkpoint change, check, and freeze. Start from caller-visible input and apply Nystrom/Karpathy/Norvig standards. Later versions begin at named verified earlier final checkpoints with explicit files and setup commands. Replay from an empty directory, freeze each version's own assembled runnable checkpoint, and verify it before advancing. Keep public prose natural and commit metadata outside tutorial bodies. Do not add a document-mode selector or combined implementation article."
