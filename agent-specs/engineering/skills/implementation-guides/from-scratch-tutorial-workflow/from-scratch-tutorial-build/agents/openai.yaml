interface:
  display_name: "From-Scratch Tutorial Build"
  short_description: "v0.2.0 - Build Nystrom/Karpathy/Norvig tutorials"
  default_prompt: "Use $from-scratch-tutorial-build to produce a complete markdown from-scratch implementation tutorial. Apply the Nystrom/Karpathy/Norvig standard: start from a real scenario, compress it into a small complete model, keep code runnable from zero, and grow one connected working version at a time. Each step must internally satisfy Pressure -> Naive version -> Break -> Change -> Check -> Freeze, with one patch or checkpoint target and a final assembled checkpoint. Public output should read like a natural tutorial, not a compliance checklist; run self-review internally and do not output Step Self-Review."
