<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --paper: #ffffff;
      --text: #1f2933;
      --muted: #617083;
      --line: #d9e0e8;
      --accent: #2f6f73;
      --warn: #8a5a00;
      --danger: #9b2c2c;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }
    article {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 32px;
    }
    h1, h2, h3 {
      line-height: 1.2;
      margin: 0 0 12px;
    }
    h1 {
      font-size: 2rem;
    }
    h2 {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 1.35rem;
    }
    p, ul, ol, table {
      margin-top: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 0.95rem;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      vertical-align: top;
    }
    th {
      background: #eef3f6;
      text-align: left;
    }
    .meta, .muted {
      color: var(--muted);
    }
    .callout {
      border-left: 4px solid var(--accent);
      background: #eef7f6;
      padding: 12px 16px;
      margin: 16px 0;
    }
    .warning {
      border-left-color: var(--warn);
      background: #fff8e8;
    }
    .danger {
      border-left-color: var(--danger);
      background: #fff0f0;
    }
    .tag {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      margin-right: 6px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    code {
      background: #eef1f4;
      border-radius: 4px;
      padding: 1px 4px;
    }
    @media (max-width: 720px) {
      main {
        padding: 20px 12px 36px;
      }
      article {
        padding: 22px 16px;
      }
      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <article>
      <header>
        <p class="meta">{{REPORT_META}}</p>
        <h1>{{REPORT_TITLE}}</h1>
        <p>{{REPORT_SUMMARY}}</p>
      </header>

      {{REPORT_BODY}}
    </article>
  </main>
</body>
</html>
