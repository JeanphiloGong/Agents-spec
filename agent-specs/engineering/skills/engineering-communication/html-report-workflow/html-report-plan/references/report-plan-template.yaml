schema_version: "0.2"
skill_version: "0.2.0"
artifact_type: html_report_deck

report_job:
  topic: "<report subject>"
  goal: "<decision, understanding, or action this deck should support>"
  delivery_mode: "self_read | live | both"

audience:
  primary_reader: "<reader or decision-maker>"
  decision_context: "<where and why the deck will be used>"
  audience_action: "<what the reader should decide or do>"

output:
  directory: "<target directory or unknown>"
  filename: "<target html filename or proposed name>"
  language: "<report language>"
  canvas: "1600x900"

logic_spine:
  one_thing: "<single conclusion the reader should remember>"
  ask: "<decision or action requested>"
  through_line: "<reasoning path from evidence to conclusion and action>"
  narrative_pattern: "answer-support-action | situation-diagnosis-resolution | finding-evidence-implication"

source_context:
  inspected:
    - id: E1
      source: "<file, command output, inspected image, or source>"
      location: "<path, section, line, timestamp, or other locator>"
      supports:
        - C1
  needs_verification:
    - id: E2
      source: "<source or claim that still needs checking>"
      reason: "<why verification is incomplete>"

claims:
  - id: C1
    type: "fact | inference | recommendation | unknown"
    statement: "<one major claim>"
    evidence_ids:
      - E1
    rationale: "<required for inference or recommendation; empty only for a directly supported fact>"

slides:
  - id: S1
    role: "<opening | summary | finding | evidence | implication | risk | recommendation | action | appendix>"
    question: "<single question this slide answers>"
    action_title: "<short complete sentence stating the slide conclusion>"
    primary_claim_id: C1
    evidence_ids:
      - E1
    content_points:
      - "<only the support needed for the action title>"
    visual_role: "text-summary | chart | table | comparison | diagram"
    so_what: "<why this conclusion matters to the reader>"
    transition: "<how this conclusion leads to the next slide>"
    source_note: "<visible source wording or explicitly labeled unknown>"

titles_only_check:
  sequence:
    - "<S1 action title>"
  reads_as_argument: false
  gaps:
    - "<missing setup, unsupported jump, unclear antecedent, or none>"

deck_organization:
  reading_path:
    - "<what the reader should conclude first>"
    - "<which evidence the reader should inspect next>"
    - "<which decision or action the reader should reach last>"
  first_slide: "<subject, context, and main conclusion>"
  navigation:
    - previous
    - next
    - overview
    - fullscreen
    - print
  evidence_placement: "<inline source notes | evidence slides | appendix | mixed>"
  density: "<how dense evidence is split or moved to appendix slides>"

quality_bar:
  - "titles alone form a coherent argument"
  - "each slide has one primary conclusion and one visible evidence object"
  - "every major claim maps to inspected evidence or is explicitly labeled"
  - "the fixed 1600x900 canvas scales without content reflow"
  - "keyboard navigation, overview, fullscreen, and print work"
  - "every slide is rendered and visually inspected"
  - "no placeholders, secrets, credentials, private data, or unsupported claims"

build_constraints:
  - "one self-contained HTML file with no required remote assets"
  - "all evidence on the current slide is visible without staged reveals"
  - "facts, inferences, recommendations, and unknowns are distinguishable"
  - "the build follows the approved slide sequence and action titles"
