schema_version: "0.3"
skill_version: "0.3.0"
artifact_type: html_report_deck

report_job:
  topic: "<report subject>"
  goal: "<decision, understanding, or action this deck should support>"
  delivery_mode: "self_read | live | both"

audience:
  primary_reader: "<reader or decision-maker>"
  decision_context: "<where and why the deck will be used>"
  audience_action: "<what the reader should decide or do>"

output:
  directory: "<target directory or unknown>"
  filename: "<target html filename or proposed name>"
  language: "<report language>"
  canvas: "1600x900"

argument:
  method: minto_pyramid
  governing_question:
    id: Q0
    text: "<single question the whole deck must answer>"
  governing_answer_claim_id: C0
  audience_decision: "<decision or action enabled by the answer>"
  reasoning_mode: "deductive | inductive"
  key_line_claim_ids:
    - C1

source_context:
  inspected:
    - id: E1
      source: "<file, command output, inspected image, or source>"
      location: "<path, section, line, timestamp, or other locator>"
      supports:
        - C0
        - C1
  needs_verification:
    - id: E2
      source: "<source or claim that still needs checking>"
      reason: "<why verification is incomplete>"

claims:
  - id: C0
    type: recommendation
    statement: "<governing answer; also the first main action title>"
    supports_claim_id: null
    evidence_ids:
      - E1
    rationale: "<why this answer follows from the key line>"
  - id: C1
    type: "fact | inference | recommendation | unknown"
    statement: "<one necessary supporting claim>"
    supports_claim_id: C0
    evidence_ids:
      - E1
    rationale: "<required for inference or recommendation; otherwise empty>"

concept_ledger:
  - id: K0
    term: "<concept already known to the audience>"
    status: given
    introduced_on_slide_id: null
    required_by_question_id: null
  - id: K1
    term: "<new concept needed to answer one incoming question>"
    status: introduced
    introduced_on_slide_id: S2
    required_by_question_id: Q1

slides:
  - id: S1
    story_section: main
    role: answer
    question_in:
      id: Q0
      text: "<same governing question>"
    action_title: "<exact C0 statement>"
    answer_claim_id: C0
    evidence_ids:
      - E1
    concept_ids:
      - K0
    content_points:
      - "<only support needed to understand the governing answer>"
    visual_role: "text-summary | chart | table | comparison | diagram"
    so_what: "<why the answer matters to this reader>"
    question_out:
      id: Q1
      text: "<one natural question created by the answer>"
    source_note: "<visible source wording or explicit unknown>"

  - id: S2
    story_section: main
    role: "support | diagnosis | implication | risk | decision | action"
    question_in:
      id: Q1
      text: "<exact S1 question_out text>"
    action_title: "<exact C1 statement>"
    answer_claim_id: C1
    evidence_ids:
      - E1
    concept_ids:
      - K0
      - K1
    content_points:
      - "<only support needed to answer Q1>"
    visual_role: "text-summary | chart | table | comparison | diagram"
    so_what: "<why this answer advances the audience decision>"
    question_out: null
    source_note: "<visible source wording or explicit unknown>"

  - id: A1
    story_section: appendix
    role: appendix
    action_title: "<exact statement of an appendix claim>"
    answer_claim_id: "<claim that supports a main-story claim>"
    evidence_ids:
      - E1
    concept_ids: []
    content_points:
      - "<API, JSON, model, ownership, flow, or other supporting detail>"
    visual_role: "table | diagram | code | text-summary"
    so_what: "<which implementation or evidence question this detail settles>"
    appendix_for_slide_ids:
      - S2
    source_note: "<visible source wording or explicit unknown>"

storyline_checks:
  titles_only:
    reads_as_argument: false
    first_break: "<slide pair or none>"
  question_chain:
    closed: false
    first_break: "<question handoff or none>"
  deletion_test:
    indispensable_main_slide_ids: []
    removable_main_slide_ids:
      - "<main slide that should be removed or none>"
  concept_continuity:
    passes: false
    first_unlicensed_concept: "<concept and slide or none>"
  appendix_separation:
    passes: false
    misplaced_slide_ids:
      - "<detail slide still interrupting the main story or none>"

deck_organization:
  reading_path:
    - "<governing answer>"
    - "<necessary diagnosis or proof>"
    - "<decision and action>"
  evidence_placement: "<inline source notes | evidence slides | appendix | mixed>"
  density: "<how dense evidence is moved to appendix slides>"
  navigation:
    - previous
    - next
    - overview
    - fullscreen
    - print

quality_bar:
  - "the governing answer appears on the first main slide"
  - "every claim reaches the governing answer"
  - "each main slide answers the previous slide's outgoing question"
  - "every main slide is indispensable under the deletion test"
  - "new concepts are licensed by incoming questions"
  - "appendix slides follow the main story and point back to it"
  - "page count is derived rather than targeted"
  - "every major claim maps to inspected evidence or is explicitly unknown"
  - "the fixed 1600x900 canvas scales without content reflow"
  - "keyboard navigation, overview, fullscreen, and print work"
  - "every slide is rendered and visually inspected"

build_constraints:
  - "one self-contained HTML file with no required remote assets"
  - "main slides precede all appendix slides"
  - "all current-slide evidence is visible without staged reveals"
  - "build preserves the approved claim and question relationships"
  - "no fixed, minimum, preferred, or requested page count"
