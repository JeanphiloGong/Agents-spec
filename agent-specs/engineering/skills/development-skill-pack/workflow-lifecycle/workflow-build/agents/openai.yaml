interface:
  display_name: "Workflow Build"
  short_description: "v0.1.8 - Require global skeleton-only first edits"
  default_prompt: "Use $workflow-build. First inspect the task and relevant code, then state the slice scope, coverage map, invariants, boundaries, and helper gate. For every non-trivial task or slice, the first code edit across the whole slice must be skeleton-only; planning text alone does not satisfy the gate. Do not add final fields, final implementation-only imports, full method bodies, assertions, fixtures, route registrations, persistence logic, hash calculations, external calls, or business branches in that first edit. Simple targets can be named in the coverage map, but their final code waits for the implementation edit. Show the skeleton diff, then implement directly, run a coverage drift check, test, and audit speculative helpers."
