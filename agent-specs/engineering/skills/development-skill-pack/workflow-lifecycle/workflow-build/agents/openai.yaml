interface:
  display_name: "Workflow Build"
  short_description: "v0.1.9 - Require skeleton-first slices and helper drift audits"
  default_prompt: "Use $workflow-build. First inspect the task and relevant code, then state the slice scope, coverage map, invariants, boundaries, and helper gate. For every non-trivial task or slice, the first code edit across the whole slice must be skeleton-only; planning text alone does not satisfy the gate. Do not add final fields, final implementation-only imports, full method bodies, assertions, fixtures, route registrations, persistence logic, hash calculations, external calls, or business branches in that first edit. Simple targets can be named in the coverage map, but their final code waits for the implementation edit. Show the skeleton diff, implement directly, run a coverage drift check, then output helper_drift_audit before tests, verify, or commit. Undeclared helpers are drift until inlined, removed, deferred, or covered by a new skeleton checkpoint."
