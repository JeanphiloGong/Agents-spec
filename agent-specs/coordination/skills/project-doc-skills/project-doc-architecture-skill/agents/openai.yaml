interface:
  display_name: "Project Doc Architecture"
  short_description: "v0.3.0 - Design a book-like docs information architecture"
  default_prompt: "Use $project-doc-architecture-skill to inspect this repository's code ownership tree, docs tree, and reader entry surfaces, derive durable documentation nodes only from real code-owned seams, define entrypoints, overview pages, authority pages, and reading paths, place docs by lowest common ancestor, ignore docs-only grouping folders as nodes by default, and produce a target doc tree and target navigation tree that concrete file creation can later realize through $project-doc-record-skill."
