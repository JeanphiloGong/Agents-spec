interface:
  display_name: "Project Doc Architecture"
  short_description: "v0.3.7 - Design a docs IA with topic trees and subject containers"
  default_prompt: "Use $project-doc-architecture-skill to inspect this repository's code ownership tree, tests tree, docs tree, and reader entry surfaces, keep root README as a repository landing page, use docs/README as the documentation landing page, derive durable documentation nodes only from real code-owned seams, distinguish runtime ownership from test-suite ownership, place docs by lowest common ancestor, distinguish root type buckets from node-local subject containers, identify useful parent-topic and subtopic paths such as `<node>/docs/<topic_path>/`, and produce a target doc tree and target navigation tree that concrete file creation can later realize through $project-doc-record-skill."
