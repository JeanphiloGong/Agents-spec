interface:
  display_name: "Project Doc Lifecycle"
  short_description: "v0.3.6 - Maintain docs with topic-tree and lifecycle repair"
  default_prompt: "Use $project-doc-lifecycle-skill to inspect one repository, module, test-suite, or doc-family scope, compare it with current implementation reality, distinguish broad parent topics from narrower subtopic families, map canonical versus historical pages, detect broken reading order, docs-first READMEs, misplaced test coverage docs, missing bridge docs, or root-bucket piles that should become node-local topic containers, keep target nodes aligned to real code-owned seams rather than docs-only grouping folders, and produce the promotion, split, topic-family-extraction, README-role-repair, supersede, archive, and navigation-repair handoffs that $project-doc-record-skill should execute concretely."
