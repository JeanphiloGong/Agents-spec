interface:
  display_name: "Project Doc Record"
  short_description: "v0.4.12 - Record one doc with topic-tree role priority"
  default_prompt: "Use $project-doc-record-skill to inspect this repository's nearby docs, tests tree, applicable architecture or lifecycle guidance, root README, docs/README, and code ownership, determine the real code-owned ownership node and lowest common ancestor, distinguish runtime ownership from test-suite ownership before writing, promote a local topic path to `<node>/docs/<topic_path>/` once it needs a second durable page, organize paths by owning node then topic path then page role, preserve useful parent-topic and subtopic structure instead of flattening it, prefer stable lowercase kebab-case topic-first filenames, avoid opaque abbreviations and overly broad standalone names, make topic-family role priority explicit so `README.md` routes and `proposal.md` is not mistaken for adopted truth, choose the correct page role, keep one document to one clear job, use reader-facing section titles instead of operator planning labels, keep repo and node READMEs focused on purpose, boundaries, and main flow, keep docs landing pages focused on navigation, preserve child detail instead of collapsing it into a parent doc, and add only the minimum parent, topic-family, neighbor, or follow-up links needed for local discoverability."
