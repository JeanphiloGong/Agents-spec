interface:
  display_name: "Project Doc Record"
  short_description: "v0.4.4 - Record one doc with clear README-vs-docs page roles"
  default_prompt: "Use $project-doc-record-skill to inspect this repository's nearby docs, applicable architecture or lifecycle guidance, root README, docs/README, and code ownership, determine the real code-owned ownership node and lowest common ancestor, choose the correct page role before writing, keep repo and node READMEs focused on purpose, boundaries, and main flow, keep docs landing pages focused on navigation, preserve child detail instead of collapsing it into a parent doc, and add only the minimum parent, neighbor, or follow-up links needed for local discoverability."
